# SmartApply Configuration File (YAML)
# This file contains all configurable options for the email automation tool.
# Command-line arguments override these settings.

# Gmail Configuration
gmail:
  use_api: true
  credentials_path: null  # set explicit path or use --user <name>
  email_delay_min_seconds: 0.5
  email_delay_max_seconds: 1.5
  cooldown_every_n_emails: 10
  cooldown_min_seconds: 30
  cooldown_max_seconds: 60
  rate_limit_per_minute: 60

# Ollama Configuration (Local LLM)
ollama:
  base_url: http://localhost:11434
  model: llama3
  timeout_seconds: 30
  max_retries: 3
  retry_backoff_multiplier: 2

# Input File
input:
  csv_filename: sample_jobs.csv  # Filename in input/ directory (e.g., jobs.csv)
  column_mapping:
    email: "Contact Info"          # CSV column name for email
    title: "Title"                # CSV column name for job title/role
    description: "Description"     # CSV column name for job description

# Email Processing
email_processing:
  email_limit: null  # null = no limit, set to integer to limit (e.g., 10 for testing)
  daily_cap: 100
  dry_run: false
  test_mode: false
  skip_llm: false
  force_resend: false
  user_confirmation_before_send: true  # Ask user Y/N before sending each email (set to false once emails are perfect)

# Resume Configuration
resume:
  json_path: null  # auto-detect or set via --user
  pdf_path: null   # auto-detect or set via --user

# File Paths
file_paths:
  input_dir: input
  output_dir: logs
  sent_emails_db: data/sent_emails.json
  app_log: logs/app.log
  error_log: logs/error.log

# Logging
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
